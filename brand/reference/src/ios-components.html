<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lunchbox Labs iOS components (reference)</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="ios-glass.css">
<script src="ios-parts.js"></script>
<style>
  /* iOS components in light and dark. Inter stands in for SF Pro, Nunito for SF Pro Rounded; glass is approximated in CSS. */
  body { background: #d9cbd6; padding: 24px; }
  .sheetgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .panel { background: var(--sys-grouped); color: var(--label); border-radius: 22px; padding: 36px; }
  .panel h2 { font-family: var(--ll-font-sans); font-variation-settings: var(--ll-voice-display); font-weight: var(--ll-weight-display); font-size: 31px; margin: 0 0 4px; letter-spacing: -0.4px; }
  .panel .sub { margin: 0 0 8px; color: var(--label2); font-size: 15px; }
  .sec { font-family: var(--ll-font-sans); font-variation-settings: var(--ll-voice-display); font-weight: 760; font-size: 20px; margin: 30px 0 12px; letter-spacing: 0; }
  .card { background: var(--sys-cell); border-radius: 20px; padding: 18px; }
  .styles .r { display: grid; grid-template-columns: 120px 1fr; align-items: baseline; padding: 5px 0; border-bottom: 0.5px solid var(--sep); }
  .styles .r:last-child { border-bottom: 0; }
  .styles .k { color: var(--label2); font-size: 13px; }
  .btns { display: grid; gap: 10px; }
  .capsule { height: 50px; border-radius: 999px; background: var(--ll-pink); color: var(--ll-pink-label); font-weight: 600; font-size: 17px;
    display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--tint); position: relative; overflow: hidden; }
  .capsule.pressed::after { content: ""; position: absolute; inset: 0; background: rgb(0 0 0 / 0.12); }
  .capsule.disabled { opacity: 0.4; }
  .lbl { font-size: 12px; color: var(--label2); text-align: center; margin-top: -4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  /* A strip of content for glass to float over. */
  .stage { position: relative; border-radius: 20px; overflow: hidden; background: var(--sys-cell); height: 132px; }
  .stage .bg { position: absolute; inset: 0; padding: 10px 16px; font-size: 15px; line-height: 1.55; color: var(--label2); }
  .stage .dialbg { padding: 0; display: grid; justify-items: center; align-items: start; margin-top: -60px; }
  .stage .bg b { color: var(--tint); font-weight: 500; }
  .stage .fg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 14px; }
  .stage .fg.spread { justify-content: space-between; padding: 0 14px; }
  .stage .t { font-weight: 600; font-size: 17px; }
  .stage .tabbar, .stage .tabmin, .stage .float { position: static; transform: none; }
  .tgroup { height: 44px; border-radius: 999px; display: flex; align-items: center; padding: 0 4px; }
  .tgroup .gbtn { box-shadow: none; background: none; }
  .cells { border-radius: 20px; }
  .cell .ok { color: var(--tint); }
  .cell .no { color: var(--sysblue); }
  .cell small { color: var(--label2); font-size: 13px; }
  .note { font-size: 13px; color: var(--label2); margin: 10px 0 0; line-height: 1.4; }
  .fontnote { grid-column: 1 / -1; text-align: center; margin: 4px 0 0; color: #281423; font-size: 15px; }
</style>
</head>
<body>
<div class="sheetgrid" id="grid"></div>
<script>
const stage = (fg, cls = '') => `<div class="stage"><div class="bg dialbg">${dial(300)}</div><div class="fg ${cls}">${fg}</div></div>`;
const panel = (mode) => `
<section class="panel ios ios-${mode}">
  <h2>iOS components</h2>
  <p class="sub">${mode === 'light' ? 'Light' : 'Dark'} appearance. Content stays plain; navigation and controls float on glass.</p>

  <h3 class="sec">Tab bar</h3>
  <div class="grid2">
    <div>${stage(tabbar(0))}<p class="lbl" style="margin-top:6px">Expanded: two to five tabs, selected tab in the accent</p></div>
    <div>${stage(tabmin(0) + '<span style="flex:1"></span>', 'spread')}<p class="lbl" style="margin-top:6px">Minimized on scroll to the current tab</p></div>
  </div>

  <h3 class="sec">Toolbars</h3>
  <div class="grid2">
    <div>${stage(`<span class="gbtn glass">${icon.xmark()}</span><span class="t">Settings</span><span class="done">Done</span>`, 'spread')}<p class="lbl" style="margin-top:6px">Close on glass, confirm in prominent glass: the screen's one pink fill</p></div>
    <div>${stage(`<span class="tgroup glass"><span class="gbtn">${icon.location(22)}</span><span class="gbtn">${icon.car(22)}</span></span><span class="gbtn glass">${icon.gear(22)}</span>`)}<p class="lbl" style="margin-top:6px">Related items share one glass group; a fixed spacer splits groups</p></div>
  </div>

  <h3 class="sec">Actions in content</h3>
  <div class="grid2">
    <div class="btns">
      <div class="capsule">Allow Location</div><div class="lbl">Primary, one per screen</div>
      <div class="capsule pressed">Allow Location</div><div class="lbl">Pressed: 12% black overlay</div>
      <div class="capsule disabled">Allow Location</div><div class="lbl">Disabled: 40% opacity</div>
    </div>
    <div class="btns">
      <div class="plain">Not Now</div><div class="lbl">Secondary: plain, accent</div>
      ${stage(`<span class="float glass">${icon.car()}</span>`)}<div class="lbl">Floating control: an icon-only circle on regular glass, 44 to 80pt</div>
    </div>
  </div>

  <h3 class="sec">Lists and links</h3>
  <div class="cells">
    <div class="cell"><span class="ok">View Source on GitHub</span><small>Accent</small></div>
    <div class="cell"><span class="no">View Source on GitHub</span><small>System blue: avoid</small></div>
  </div>
  <p class="note">Tint links with the accent explicitly. System blue falls below 4.5:1 on light rows.</p>

  <h3 class="sec">Text styles</h3>
  <div class="card styles">
    <div class="r"><span class="k">Rounded display</span><span class="rounded" style="font-size:34px;font-weight:800;letter-spacing:0">12° N</span></div>
    <div class="r"><span class="k">Large Title</span><span style="font-size:34px;font-weight:700;letter-spacing:0.4px">Settings</span></div>
    <div class="r"><span class="k">Headline</span><span style="font-size:17px;font-weight:600">Location Enabled</span></div>
    <div class="r"><span class="k">Body</span><span style="font-size:17px">Keep the dial in view while you drive.</span></div>
    <div class="r"><span class="k">Tab label</span><span style="font-size:10px;font-weight:600">Compass</span></div>
    <div class="r"><span class="k">Footnote</span><span style="font-size:13px;color:var(--label2)">Compasslet is open source under the MIT License.</span></div>
  </div>
  <p class="note">Every style follows Dynamic Type. Rounded bold is only for brand moments.</p>
</section>`;
document.getElementById('grid').innerHTML = panel('light') + panel('dark') +
  '<p class="fontnote">Type shown with Inter in place of SF Pro and Nunito in place of SF Pro Rounded; glass is approximated in CSS. Apps use the system fonts and materials.</p>';
</script>
</body>
</html>
