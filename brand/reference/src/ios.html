<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lunchbox Labs iOS screens (reference)</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="ios-glass.css">
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') || 'light';</script>
<script src="ios-parts.js"></script>
<style>
  body { background: light-dark(#e9dfe7, #2a2029); padding: 40px; }
  [data-theme="light"] body { background: #e9dfe7; } [data-theme="dark"] body { background: #2a2029; }
  .row { display: flex; gap: 40px; justify-content: center; }
  .cap, .fontnote { text-align: center; color: var(--ll-text); font-size: 15px; }
  .cap { margin-top: 18px; max-width: 390px; }
  .fontnote { margin: 28px 0 0; }
  .scroller { position: absolute; left: 0; right: 0; }
</style>
</head>
<body>
<div class="row" id="row"></div>
<p class="fontnote">Illustrated with Compasslet's content. Inter stands in for SF Pro and Nunito for SF Pro Rounded; glass is approximated in CSS. Apps use the system fonts and materials.</p>
<script>
const phone = (cls, body, cap) => `<div><div class="phone ios ${cls}">${chrome()}${body}</div><p class="cap">${cap}</p></div>`;
document.getElementById('row').innerHTML = [
  phone('', `${compassScreen()}
    ${tabbar(0)}
    <div class="float glass" style="right:24px;bottom:100px">${icon.car()}</div>`,
    'Content on a plain background. A floating two-tab bar sits on glass, with one floating control above its trailing end.'),
  phone('grouped', `
    <div class="scroller" style="top:104px"><h1 class="largetitle">Settings</h1>${settingsList()}</div>
    ${tabbar(1)}`,
    'Settings is a tab, at rest. The list runs under the floating tab bar and its safe area lets the last row scroll clear.'),
  phone('grouped', `
    <div class="edge-top"></div>
    <div class="nav"><span></span><span class="t">Settings</span><span></span></div>
    <div class="scroller" style="top:-34px"><h1 class="largetitle" style="visibility:hidden">Settings</h1>${settingsList()}</div>
    ${tabmin(1)}`,
    'Scrolled to the end: rows pass under the scroll edge effect at the top and the tab bar minimizes to the current tab in the leading corner.'),
  phone('', `${compassScreen()}
    ${permissionSheet()}`,
    'A partial-height sheet floats inset on glass. Its content is content, with the one pink primary action.'),
  phone('', `${compassScreen()}
    <div class="float glass" style="right:90px;bottom:29px">${icon.car()}</div>
    <div class="float glass" style="right:24px;bottom:29px">${icon.gear(24)}</div>`,
    'A single-screen app can skip the tab bar. A floating gear in the trailing corner opens Settings as a sheet, beside at most one other floating control.'),
].join('');
</script>
</body>
</html>
